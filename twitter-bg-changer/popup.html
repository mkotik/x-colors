<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #15202b;
      color: #e7e9ea;
    }

    h2 {
      font-size: 16px;
      margin-bottom: 14px;
      text-align: center;
    }

    .section-label {
      font-size: 12px;
      color: #8b98a5;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    #colorPicker {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: none;
      padding: 0;
    }

    #colorPicker::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    #colorPicker::-webkit-color-swatch {
      border: 2px solid #38444d;
      border-radius: 8px;
    }

    #hexInput {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #38444d;
      border-radius: 8px;
      background: #1e2d3d;
      color: #e7e9ea;
      font-size: 14px;
      font-family: monospace;
      outline: none;
    }

    #hexInput:focus {
      border-color: #1d9bf0;
    }

    .presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .preset {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 8px;
      border: 2px solid #38444d;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }

    .preset:hover {
      transform: scale(1.1);
      border-color: #1d9bf0;
    }

    .preset.active {
      border-color: #1d9bf0;
      box-shadow: 0 0 0 2px #1d9bf0;
    }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn:hover {
      opacity: 0.85;
    }

    #applyBtn {
      background: #1d9bf0;
      color: #fff;
      margin-bottom: 8px;
    }

    #resetBtn {
      background: transparent;
      color: #1d9bf0;
      border: 1px solid #1d9bf0;
    }
  </style>
</head>
<body>
  <h2>🎨 Twitter BG Changer</h2>

  <div class="section-label">Pick a color</div>
  <div class="color-picker-wrapper">
    <input type="color" id="colorPicker" value="#15202b">
    <input type="text" id="hexInput" value="#15202b" maxlength="7" placeholder="#000000">
  </div>

  <div class="section-label">Presets</div>
  <div class="presets">
    <button class="preset" data-color="#000000" style="background:#000000" title="Black"></button>
    <button class="preset" data-color="#15202b" style="background:#15202b" title="Twitter Dark Blue"></button>
    <button class="preset" data-color="#1a1a2e" style="background:#1a1a2e" title="Dark Navy"></button>
    <button class="preset" data-color="#2d2d2d" style="background:#2d2d2d" title="Dark Grey"></button>
    <button class="preset" data-color="#0d1117" style="background:#0d1117" title="GitHub Dark"></button>
    <button class="preset" data-color="#1e1e1e" style="background:#1e1e1e" title="VS Code Dark"></button>
    <button class="preset" data-color="#2c1e3f" style="background:#2c1e3f" title="Dark Purple"></button>
    <button class="preset" data-color="#ffffff" style="background:#ffffff" title="White"></button>
  </div>

  <button class="btn" id="applyBtn">Apply Color</button>
  <button class="btn" id="resetBtn">Reset to Default</button>

  <script src="popup.js"></script>
</body>
</html>
